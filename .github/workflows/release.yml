name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Attest main.js
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js

      - name: Attest manifest.json
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: manifest.json

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES.md is required for a public release" >&2
            exit 1
          fi
          # Use curated notes only — never --generate-notes for the public page.
          gh release create "$tag" \
            --title="$tag" \
            --notes-file RELEASE_NOTES.md \
            main.js manifest.json styles.css
